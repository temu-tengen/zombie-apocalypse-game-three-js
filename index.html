<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Zombie</title>
    <style>
      body { margin: 0; }
      #ui {
        z-index: 1000;
        position: fixed;

        font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-weight: bold;

        display: flex;
        justify-content: center;

        background: linear-gradient(to bottom, rgba(0, 0, 0, 1), rgba(0, 100, 0, 0));
        width: 100%;
        height: 100%;

        color: white;
      }

      #health {
        color: red;
        margin: 20px;
      }

      #title {

        font-size: 50px;
      }
      #subtitle {
        margin-top: 10%;
        font-size: 50px;
      }
      
    </style>
  </head>
  <body>
    <script type="module" src="/script.js"></script>

    <div id="ui">
      <p id="health">Health: 100</p>

      <h1 id="title">Zombie Apocolypse</h1>
      <p id="subtitle">Enter to Start</p>
    </div>
  </body>
</html>
