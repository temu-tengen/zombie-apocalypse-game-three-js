<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Zombie</title>
    <style>
      body { margin: 0; }
      #ui {
        z-index: 1000;
        position: fixed;

        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: bold;

        display: flex;
        flex-direction: column; /* FIX: stack title and subtitle vertically */
        align-items: center;
        justify-content: center;

        background: linear-gradient(to bottom, rgba(0, 0, 0, 1), rgba(0, 100, 0, 0));
        width: 100%;
        height: 100%;

        color: white;
      }

      #health { color: red; margin: 20px; }
      #score { color: white; margin: 20px; }
      #stage { color: white; margin: 20px; }

      #ingameui {
        position: fixed;
        z-index: 1000;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 50px;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;

        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: bolder;
      }

      #title { font-size: 50px; margin: 0; }
      #subtitle { font-size: 30px; margin-top: 20px; font-weight: normal; }
      #entertostart { font-size: 20px; margin-top: 20px; font-weight: bolder; }
      #wallhealth { color: red; margin: 20px; }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1 id="title">Zombie Apocalypse</h1>
      <p id="subtitle">Enter to Start</p>
      <p id="subtitle">WASD to Move, Left Shift to Shoot, Space for Jump</p>
      <p id="subtitle">Yellow power-ups speed, Green power-ups jump height, Red power-ups health</p>
    </div>

    <div id="ingameui">
      <p id="health">Health: 100</p>
      <p id="score">Score: 0</p>
      <p id="stage">Stage 1</p>
      <p id="wallhealth">Wall Health: 100</p>
    </div>

    <script type="module" src="/script.js"></script>
  </body>
</html>
